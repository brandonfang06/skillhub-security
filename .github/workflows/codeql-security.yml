name: CodeQL Java and JavaScript security

on:
  push:
    branches: [dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      security-events: write
      packages: read
    strategy:
      fail-fast: false
      matrix:
        language: [java-kotlin, javascript-typescript]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        if: matrix.language == 'java-kotlin'
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - uses: github/codeql-action/init@793b778da9c9275a0f276522b27cb5fc14bba279
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
          build-mode: ${{ matrix.language == 'java-kotlin' && 'manual' || 'none' }}
      - name: Build Java for cross-file security analysis
        if: matrix.language == 'java-kotlin'
        working-directory: server
        run: ./mvnw -B -DskipTests package
      - uses: github/codeql-action/analyze@793b778da9c9275a0f276522b27cb5fc14bba279
        with:
          category: /language:${{ matrix.language }}
          output: codeql-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codeql-${{ matrix.language }}
          path: codeql-results/*.sarif
          if-no-files-found: error
